<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps CI/CD Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .details {
            text-align: left;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.8;
        }

        .details strong {
            color: #333;
        }

        footer {
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🚀</div>

        <h1>DevOps CI/CD Demo</h1>

        <p class="subtitle">
            Containerized Web Application
        </p>

        <div class="status">
            ✓ Deployment Successful
        </div>

        <div class="details">
            <p><strong>CI/CD:</strong> GitHub Actions</p>
            <p><strong>Containerization:</strong> Docker</p>
            <p><strong>Web Server:</strong> Nginx</p>
            <p><strong>Deployment:</strong> Local System</p>
            <p><strong>Status:</strong> Application is running successfully</p>
        </div>

        <footer>
            DevOps and Deployment Experiment – 10
        </footer>

    </div>

</body>
</html>
